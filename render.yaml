services:
  - type: web
    name: kawsay-cultural-platform
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /var/data/kawsay.db
    disk:
      name: kawsay-disk
      mountPath: /var/data
      sizeGB: 1
